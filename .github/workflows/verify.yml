# Verificação automatizada (ADR-0023 §14).
#
# Executa o MESMO comando definido em package.json (`pnpm verify`), sem duplicar
# a definição (ADR-0023 §9).
#
# A barreira efetiva é a proteção de ramificação exigindo este workflow aprovado
# como condição de incorporação (ADR-0023 §17).

name: Verificação

on:
  push:
  pull_request:

jobs:
  verify:
    name: Verificar
    runs-on: ubuntu-latest

    steps:
      # Sem o submódulo: nada em `verify` lê docs/, que está fora do tsconfig,
      # do ESLint e do Prettier. Buscá-lo só acrescentaria tempo a cada execução.
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Verificar
        run: pnpm run verify

      - name: Construir
        run: pnpm run build

  e2e:
    name: Fluxos e responsividade
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Testar uso, fluxos e telas
        run: pnpm run test:e2e
      - name: Guardar relatório e evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
